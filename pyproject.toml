[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory-system"
version = "1.0.1"
description = "Agricultural harvest tracking system with scale integration"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1",
    "Flask-Migrate>=4.0",
    "Flask-SQLAlchemy>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "waitress>=3.0",
    "pyserial>=3.5",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
