<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <title>Administración</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1 class="admin-header__title">Administración</h1>
            <nav class="admin-header__nav">
                <a href="/" class="admin-header__link">Recepción</a>
                <a href="/history" class="admin-header__link">Historial</a>
                <a href="/reports" class="admin-header__link">Reportes</a>
                <button id="logout-btn" class="btn btn--logout" type="button">Cerrar sesión</button>
            </nav>
        </header>

        <section class="card" id="create-section">
            <h2 class="card__title">Registrar trabajador</h2>

            <form id="create-form" class="form" autocomplete="off">
                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="create-name">Nombre</label>
                        <input class="form__input" type="text" id="create-name"
                            placeholder="Nombre del trabajador" autocomplete="off">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="create-barcode">Código de barras</label>
                        <input class="form__input" type="text" id="create-barcode"
                            placeholder="Código único" autocomplete="off">
                    </div>
                </div>

                <div id="create-message" class="form__message" hidden></div>

                <button class="form__button" type="submit" id="create-submit">
                    Registrar
                </button>
            </form>
        </section>

        <section class="card" id="list-section">
            <div class="list-header">
                <h2 class="card__title">Trabajadores</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="search-input"
                        placeholder="Nombre o código..." autocomplete="off">
                </div>
            </div>

            <div id="worker-list" class="worker-list">
                <p class="worker-list__empty">Cargando trabajadores...</p>
            </div>
        </section>

        <section class="card" id="entries-section">
            <div class="list-header">
                <h2 class="card__title">Movimientos de cosecha</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="entry-date-input">Fecha</label>
                    <input class="search-zone__input" type="date" id="entry-date-input">
                    <label class="search-zone__label" for="entry-search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="entry-search-input"
                        placeholder="Nombre o código..." autocomplete="off">
                </div>
            </div>

            <div id="entries-list" class="entries-list">
                <p class="entries-list__empty">Cargando movimientos...</p>
            </div>
        </section>

    </div>

    <div id="void-modal" class="modal" hidden>
        <div class="modal__content">
            <h3 class="modal__title">Anular movimiento</h3>
            <p class="modal__text" id="void-modal-text"></p>
            <div class="form__group">
                <label class="form__label" for="void-reason-input">Motivo de anulación *</label>
                <textarea class="form__input" id="void-reason-input" rows="3"
                    placeholder="Describa el motivo de la anulación"></textarea>
            </div>
            <div class="modal__actions">
                <button class="btn btn--cancel" type="button" id="void-cancel-btn">Cancelar</button>
                <button class="btn btn--danger" type="button" id="void-confirm-btn">Confirmar anulación</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>

</html>
