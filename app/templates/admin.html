<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <title>Administración</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1 class="admin-header__title">Administración</h1>
            <nav class="admin-header__nav">
                <a href="/" class="admin-header__link">Recepción</a>
                <a href="/history" class="admin-header__link">Historial</a>
                <a href="/reports" class="admin-header__link">Reportes</a>
                <button id="logout-btn" class="btn btn--logout" type="button">Cerrar sesión</button>
            </nav>
        </header>

        <section class="card" id="create-section">
            <h2 class="card__title">Registrar trabajador</h2>

            <form id="create-form" class="form" autocomplete="off">
                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="create-name">Nombre</label>
                        <input class="form__input" type="text" id="create-name"
                            placeholder="Nombre del trabajador" autocomplete="off">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="create-barcode">Código de barras</label>
                        <input class="form__input" type="text" id="create-barcode"
                            placeholder="Código único" autocomplete="off">
                    </div>
                </div>

                <div id="create-message" class="form__message" hidden></div>

                <button class="form__button" type="submit" id="create-submit">
                    Registrar
                </button>
            </form>
        </section>

        <section class="card" id="list-section">
            <div class="list-header">
                <h2 class="card__title">Trabajadores</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="search-input"
                        placeholder="Nombre o código..." autocomplete="off">
                </div>
            </div>

            <div id="worker-list" class="worker-list">
                <p class="worker-list__empty">Cargando trabajadores...</p>
            </div>
        </section>

        <section class="card" id="products-section">
            <h2 class="card__title">Productos</h2>

            <form id="product-form" class="form" autocomplete="off">
                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="product-name">Nombre</label>
                        <input class="form__input" type="text" id="product-name"
                            placeholder="Nombre del producto" autocomplete="off"
                            required maxlength="100">
                    </div>

                    <div class="form__group">
                        <label class="form__label" for="product-rate">Precio por kg (MXN)</label>
                        <input class="form__input" type="number" id="product-rate"
                            placeholder="0.00" step="0.01" min="0" max="999999.99"
                            inputmode="decimal" autocomplete="off" required>
                    </div>
                </div>

                <div id="product-message" class="form__message" hidden></div>

                <button class="form__button" type="submit" id="product-submit">
                    Registrar
                </button>
            </form>

            <div class="list-header list-header--products">
                <div class="search-zone">
                    <label class="search-zone__label" for="product-search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="product-search-input"
                        placeholder="Nombre del producto..." autocomplete="off">
                </div>
            </div>

            <div id="product-list" class="worker-list">
                <p class="worker-list__empty">Cargando productos...</p>
            </div>
        </section>

        <section class="card" id="entries-section">
            <div class="list-header">
                <h2 class="card__title">Movimientos de cosecha</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="entry-date-input">Fecha</label>
                    <input class="search-zone__input" type="date" id="entry-date-input">
                    <label class="search-zone__label" for="entry-search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="entry-search-input"
                        placeholder="Nombre o código..." autocomplete="off">
                </div>
            </div>

            <div id="entries-list" class="entries-list">
                <p class="entries-list__empty">Cargando movimientos...</p>
            </div>
        </section>

        <section class="card" id="backups-section">
            <div class="list-header">
                <h2 class="card__title">Respaldos</h2>
                <button class="form__button" type="button" id="backup-create-btn">
                    Crear respaldo
                </button>
            </div>

            <div id="backup-message" class="form__message" hidden></div>

            <div id="backup-latest" class="backup-latest" hidden>
                <h3 class="backup-latest__title">Último respaldo</h3>
                <div id="backup-latest-info" class="backup-latest__info"></div>
            </div>

            <div id="backup-list" class="backup-list">
                <p class="backup-list__empty">Cargando respaldos...</p>
            </div>
        </section>

    </div>

    <div id="void-modal" class="modal" hidden>
        <div class="modal__content">
            <h3 class="modal__title">Anular movimiento</h3>
            <p class="modal__text" id="void-modal-text"></p>
            <div class="form__group">
                <label class="form__label" for="void-reason-input">Motivo de anulación *</label>
                <textarea class="form__input" id="void-reason-input" rows="3"
                    placeholder="Describa el motivo de la anulación"></textarea>
            </div>
            <div class="modal__actions">
                <button class="btn btn--cancel" type="button" id="void-cancel-btn">Cancelar</button>
                <button class="btn btn--danger" type="button" id="void-confirm-btn">Confirmar anulación</button>
            </div>
        </div>
    </div>

    <div id="edit-product-modal" class="modal" hidden>
        <div class="modal__content">
            <h3 class="modal__title">Editar producto</h3>
            <form id="edit-product-form" class="form" autocomplete="off">
                <input type="hidden" id="edit-product-id">
                <div class="form__row">
                    <div class="form__group">
                        <label class="form__label" for="edit-product-name">Nombre</label>
                        <input class="form__input" type="text" id="edit-product-name" autocomplete="off"
                            required maxlength="100">
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="edit-product-rate">Precio por kg (MXN)</label>
                        <input class="form__input" type="number" id="edit-product-rate"
                            step="0.01" min="0" max="999999.99" inputmode="decimal" autocomplete="off" required>
                    </div>
                </div>
                <div id="edit-product-message" class="form__message" hidden></div>
                <div class="modal__actions">
                    <button class="btn btn--cancel" type="button" id="edit-product-cancel-btn">Cancelar</button>
                    <button class="btn btn--primary" type="submit" id="edit-product-save-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.ADMIN_CONFIG = {
            operationalToday: {{ operational_today | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>

</html>
