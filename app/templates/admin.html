<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <title>Administraci&oacute;n</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<body>

    <div class="admin-wrapper">

        <header class="admin-header">
            <h1 class="admin-header__title">Administraci&oacute;n</h1>
            <nav class="admin-header__nav">
                <a href="/" class="admin-header__link">Recepci&oacute;n</a>
                <a href="/admin/products" class="admin-header__link">Productos</a>
                <a href="/history" class="admin-header__link">Historial</a>
                <a href="/reports" class="admin-header__link">Reportes</a>
                <button id="logout-btn" class="btn btn--logout" type="button">Cerrar sesi&oacute;n</button>
            </nav>
        </header>

        <section class="card" id="slots-section">
            <div class="list-header">
                <h2 class="card__title">Cupos de trabajo</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="slot-search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="slot-search-input"
                        placeholder="Cupo, c&oacute;digo o nombre..." autocomplete="off">
                </div>
            </div>

            <div class="slots-actions">
                <button class="form__button form__button--danger" type="button" id="clean-slots-btn">
                    Limpiar todas las asignaciones
                </button>
                <a href="/api/admin/worker-slots/export" class="form__button" id="export-slots-btn">
                    Exportar credenciales
                </a>
            </div>

            <div id="slot-list" class="worker-list">
                <p class="worker-list__empty">Cargando cupos...</p>
            </div>
        </section>

        <section class="card" id="entries-section">
            <div class="list-header">
                <h2 class="card__title">Movimientos de cosecha</h2>

                <div class="search-zone">
                    <label class="search-zone__label" for="entry-date-input">Fecha</label>
                    <input class="search-zone__input" type="date" id="entry-date-input">
                    <label class="search-zone__label" for="entry-search-input">Buscar</label>
                    <input class="search-zone__input" type="text" id="entry-search-input"
                        placeholder="Nombre o c&oacute;digo..." autocomplete="off">
                </div>
            </div>

            <div id="entries-list" class="entries-list">
                <p class="entries-list__empty">Cargando movimientos...</p>
            </div>
        </section>

        <section class="card" id="backups-section">
            <div class="list-header">
                <h2 class="card__title">Respaldos</h2>
                <button class="form__button" type="button" id="backup-create-btn">
                    Crear respaldo
                </button>
            </div>

            <div id="backup-message" class="form__message" hidden></div>

            <div id="backup-latest" class="backup-latest" hidden>
                <h3 class="backup-latest__title">&Uacute;ltimo respaldo</h3>
                <div id="backup-latest-info" class="backup-latest__info"></div>
            </div>

            <div id="backup-list" class="backup-list">
                <p class="backup-list__empty">Cargando respaldos...</p>
            </div>
        </section>

    </div>

    <div id="void-modal" class="modal" hidden>
        <div class="modal__content">
            <h3 class="modal__title">Anular movimiento</h3>
            <p class="modal__text" id="void-modal-text"></p>
            <div class="form__group">
                <label class="form__label" for="void-reason-input">Motivo de anulaci&oacute;n *</label>
                <textarea class="form__input" id="void-reason-input" rows="3"
                    placeholder="Describa el motivo de la anulaci&oacute;n"></textarea>
            </div>
            <div class="modal__actions">
                <button class="btn btn--cancel" type="button" id="void-cancel-btn">Cancelar</button>
                <button class="btn btn--danger" type="button" id="void-confirm-btn">Confirmar anulaci&oacute;n</button>
            </div>
        </div>
    </div>

    <div id="assign-modal" class="modal" hidden>
        <div class="modal__content">
            <h3 class="modal__title">Asignar persona al cupo</h3>
            <p class="modal__text" id="assign-modal-text"></p>
            <form id="assign-form" class="form" autocomplete="off">
                <input type="hidden" id="assign-worker-id">
                <div class="form__group">
                    <label class="form__label" for="assign-person-name">Nombre de la persona</label>
                    <input class="form__input" type="text" id="assign-person-name"
                        placeholder="Nombre completo" autocomplete="off"
                        required maxlength="100">
                </div>
                <div id="assign-message" class="form__message" hidden></div>
                <div class="modal__actions">
                    <button class="btn btn--cancel" type="button" id="assign-cancel-btn">Cancelar</button>
                    <button class="btn btn--primary" type="submit" id="assign-save-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        window.ADMIN_CONFIG = {
            operationalToday: {{ operational_today | tojson }}
        };
    </script>
    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>

</html>
