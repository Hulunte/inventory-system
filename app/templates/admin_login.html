<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ session.get('csrf_token', '') }}">

    <title>Acceso Administrativo</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}">
</head>

<body>

    <div id="app-splash" class="app-splash" role="status" aria-label="Cargando aplicacion">
        <img class="app-splash__logo" src="{{ url_for('static', filename='img/branding/logo-agricola-vita-santa-fe.png') }}" alt="Agricola Vita Santa Fe">
        <p class="app-splash__text">Agr&iacute;cola Vita Santa Fe</p>
    </div>

    <div class="login-wrapper">

        <header class="login-header brand-header">
            <img class="brand-logo brand-logo--compact" src="{{ url_for('static', filename='img/branding/logo-agricola-vita-santa-fe.png') }}" alt="Agricola Vita Santa Fe">
            <h1 class="login-header__title">Acceso Administrativo</h1>
        </header>

        <section class="card login-card">
            <form id="login-form" class="form" autocomplete="off">
                <div class="form__group">
                    <label class="form__label" for="password">Contraseña</label>
                    <input class="form__input" type="password" id="password"
                        placeholder="Contraseña de administrador" autocomplete="off" autofocus>
                </div>

                <div id="login-message" class="form__message" hidden></div>

                <button class="form__button" type="submit" id="login-submit">
                    Ingresar
                </button>
            </form>
        </section>

    </div>

    <script src="{{ url_for('static', filename='js/admin_login.js') }}"></script>
    <script src="{{ url_for('static', filename='js/splash.js') }}"></script>
</body>

</html>
