<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de cosecha</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/reception.css') }}">
</head>

<body>

    <div class="reception-wrapper">

        <header class="reception-header">
            <h1 class="reception-header__title">Registro de cosecha</h1>
            <nav class="reception-header__nav">
                <a href="/admin" class="reception-header__link">Administraci&oacute;n</a>
                <a href="/history" class="reception-header__link">Historial</a>
                <a href="/reports" class="reception-header__link">Reportes</a>
            </nav>
            <p class="reception-header__subtitle">Escanee el c&oacute;digo del trabajador</p>
        </header>

        <section class="card product-selector" id="product-selector">
            <h2 class="product-selector__title">Producto</h2>
            <div id="product-buttons" class="product-selector__buttons">
                <div class="status-message status-message--loading">
                    <span class="spinner"></span>
                    Cargando productos...
                </div>
            </div>
            <div id="product-warning" class="status-message status-message--error" hidden>
                No hay productos activos. Contacte al administrador.
            </div>
        </section>

        <section class="card scanner-zone">
            <div class="scanner-zone__icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 7V5a2 2 0 0 1 2-2h2" />
                    <path d="M17 3h2a2 2 0 0 1 2 2v2" />
                    <path d="M21 17v2a2 2 0 0 1-2 2h-2" />
                    <path d="M7 21H5a2 2 0 0 1-2-2v-2" />
                    <line x1="7" y1="12" x2="17" y2="12" />
                    <line x1="7" y1="8" x2="17" y2="8" />
                    <line x1="7" y1="16" x2="17" y2="16" />
                </svg>
            </div>
            <label class="scanner-zone__label" for="barcode">C&oacute;digo del trabajador</label>
            <input class="scanner-zone__input" type="text" id="barcode"
                placeholder="Escanee o escriba un c&oacute;digo" autocomplete="off" autofocus>
        </section>

        <div id="product-info" class="card">
            <div class="status-message status-message--idle">
                Esperando trabajador...
            </div>
        </div>

        <section class="card recent-movements" id="recent-movements">
            <div class="recent-movements__header">
                <h2 class="recent-movements__title">Movimientos recientes</h2>
                <button type="button" class="recent-movements__refresh" id="refresh-movements">
                    Actualizar
                </button>
            </div>
            <div id="movements-content" aria-live="polite">
                <div class="status-message status-message--loading">
                    <span class="spinner"></span>
                    Cargando movimientos...
                </div>
            </div>
        </section>

    </div>

    <script src="{{ url_for('static', filename='js/reception.js') }}"></script>
</body>

</html>
